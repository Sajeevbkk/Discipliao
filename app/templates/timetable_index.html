{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h2 class="mb-0 h4">Generate Time Table</h2>
                <a href="{{ url_for('main.index') }}" class="btn btn-secondary btn-sm"><i class="bi bi-house"></i> Home</a>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('timetable.index') }}">
                    <div class="mb-3">
                        <label for="day_id" class="form-label">Select Day</label>
                        <select id="day_id" name="day_id" class="form-select" required>
                            <option value="">Select Day</option>
                            {% for day in days %}
                                <option value="{{ day[0] }}">{{ day[1] }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg"><i class="bi bi-gear-fill"></i> Generate Schedule</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
