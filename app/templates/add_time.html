{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h2 class="mb-0 h4">Add Time Slot</h2>
                <a href="{{ url_for('add.index') }}" class="btn btn-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back</a>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('add.add_time') }}">
                    <div class="mb-3">
                        <label for="day_id" class="form-label">Day</label>
                        <select id="day_id" name="day_id" class="form-select" required>
                            <option value="">Select Day</option>
                            {% for day in days %}
                                <option value="{{ day[0] }}">{{ day[1] }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="from_time" class="form-label">From Time</label>
                        <input type="time" id="from_time" name="from_time" class="form-control" required>
                        <div class="form-text">Select the start time for this study slot.</div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Add Time Slot</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
