{% extends "layout.html" %}
{% block content %}
<div class="row mb-4">
    <div class="col-12 d-flex justify-content-between align-items-center">
        <h2>Chapters in: {{ subject[1] }}</h2>
        <div>
            <a href="{{ url_for('edit.index') }}" class="btn btn-secondary me-2"><i class="bi bi-arrow-left"></i> Back to Edit Menu</a>
        </div>
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-body p-0">
        <div class="list-group list-group-flush">
            {% for chapter in chapters %}
                <a href="{{ url_for('edit.edit_chapter', chapter_id=chapter[0]) }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="mb-1">{{ chapter[1] }}</h5>
                    </div>
                    <div>
                        <a href="{{ url_for('edit.list_topics', chapter_id=chapter[0]) }}" class="btn btn-sm btn-outline-info me-2">Edit Topics in Chapter</a>
                        <i class="bi bi-pencil-square text-primary"></i> Edit Chapter
                    </div>
                </a>
            {% else %}
                <div class="list-group-item text-muted fst-italic text-center py-4">
                    No chapters found for this subject.
                </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
