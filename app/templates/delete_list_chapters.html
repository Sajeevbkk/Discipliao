{% extends "layout.html" %}
{% block content %}
<div class="row mb-4">
    <div class="col-12 d-flex justify-content-between align-items-center">
        <h2>Delete Chapters in: {{ subject[1] }}</h2>
        <div>
            <a href="{{ url_for('delete.index') }}" class="btn btn-secondary me-2"><i class="bi bi-arrow-left"></i> Back to Delete Menu</a>
        </div>
    </div>
</div>

<div class="card shadow-sm border-danger">
    <div class="card-body p-0">
        <div class="list-group list-group-flush">
            {% for chapter in chapters %}
                <div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="mb-1 text-danger">{{ chapter[1] }}</h5>
                        <small class="text-muted">Cascades to topics</small>
                    </div>
                    <div>
                        <a href="{{ url_for('delete.list_topics', chapter_id=chapter[0]) }}" class="btn btn-sm btn-outline-secondary me-2">Delete Topics</a>
                        <form method="POST" action="{{ url_for('delete.delete_chapter', chapter_id=chapter[0]) }}" class="d-inline" onsubmit="return confirm('Are you sure you want to delete this chapter and all its topics?');">
                            <button type="submit" class="btn btn-sm btn-danger"><i class="bi bi-trash"></i> Delete</button>
                        </form>
                    </div>
                </div>
            {% else %}
                <div class="list-group-item text-muted fst-italic text-center py-4">
                    No chapters found for this subject.
                </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
