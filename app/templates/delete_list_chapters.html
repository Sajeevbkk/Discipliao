{% extends "layout.html" %}
{% block content %}
    <h2>Chapters in {{ subject[1] }}</h2>
    <a href="{{ url_for('delete.index') }}">Back</a>
    <ul>
        {% for chapter in chapters %}
            <li>
                {{ chapter[1] }}
                <form method="POST" action="{{ url_for('delete.delete_chapter', chapter_id=chapter[0]) }}" style="display:inline;">
                    <button type="submit" onclick="return confirm('Are you sure you want to delete this chapter and all related topics?');">Delete</button>
                </form> |
                <a href="{{ url_for('delete.list_topics', chapter_id=chapter[0]) }}">View Topics to Delete</a>
            </li>
        {% else %}
            <li>No chapters found.</li>
        {% endfor %}
    </ul>
{% endblock %}
