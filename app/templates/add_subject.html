{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h2 class="mb-0 h4">Add Subject</h2>
                <a href="{{ url_for('add.index') }}" class="btn btn-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back</a>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('add.add_subject') }}">
                    <div class="mb-3">
                        <label for="name" class="form-label">Subject Name</label>
                        <input type="text" id="name" name="name" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="priority" class="form-label">Priority (1-10)</label>
                        <input type="number" id="priority" name="priority" class="form-control" min="1" max="10" required>
                        <div class="form-text">Higher priority subjects get scheduled more often.</div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Add Subject</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
