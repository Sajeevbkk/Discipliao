{% extends "layout.html" %}
{% block content %}
    <h2>Times in {{ day[1] }}</h2>
    <a href="{{ url_for('delete.index') }}">Back</a>
    <ul>
        {% for time in times %}
            <li>
                {{ time[1] }}
                <form method="POST" action="{{ url_for('delete.delete_time', time_id=time[0]) }}" style="display:inline;">
                    <button type="submit" onclick="return confirm('Are you sure you want to delete this time?');">Delete</button>
                </form>
            </li>
        {% else %}
            <li>No times found.</li>
        {% endfor %}
    </ul>
{% endblock %}
