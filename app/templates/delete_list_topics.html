{% extends "layout.html" %}
{% block content %}
    <h2>Topics in {{ chapter[1] }}</h2>
    <a href="{{ url_for('delete.list_chapters', subject_id=chapter[2]) }}">Back</a>
    <ul>
        {% for topic in topics %}
            <li>
                {{ topic[1] }}
                <form method="POST" action="{{ url_for('delete.delete_topic', topic_id=topic[0]) }}" style="display:inline;">
                    <button type="submit" onclick="return confirm('Are you sure you want to delete this topic?');">Delete</button>
                </form>
            </li>
        {% else %}
            <li>No topics found.</li>
        {% endfor %}
    </ul>
{% endblock %}
