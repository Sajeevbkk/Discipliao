{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h2 class="mb-0 h4">Add Day</h2>
                <a href="{{ url_for('add.index') }}" class="btn btn-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back</a>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('add.add_day') }}">
                    <div class="mb-3">
                        <label for="name" class="form-label">Day Name</label>
                        <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Monday" required autofocus>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Add Day</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
