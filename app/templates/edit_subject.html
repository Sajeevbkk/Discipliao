{% extends "layout.html" %}
{% block content %}
    <h2>Edit Subject</h2>
    <a href="{{ url_for('edit.index') }}">Back</a>
    <form method="POST" action="">
        <div>
            <label for="name">Subject Name</label>
            <input type="text" id="name" name="name" value="{{ subject[1] }}" required>
        </div>
        <div>
            <label for="priority">Priority (1-10)</label>
            <input type="number" id="priority" name="priority" value="{{ subject[2] }}" min="1" max="10" required>
        </div>
        <button type="submit">Update Subject</button>
    </form>
{% endblock %}
