{% extends "layout.html" %}
{% block content %}
    <h2>Edit Chapter</h2>
    <a href="{{ url_for('edit.list_chapters', subject_id=chapter[2]) }}">Back</a>

        <div>
            <label for="name">Chapter Name</label>
            <input type="text" id="name" name="name" value="{{ chapter[1] }}" required>
        </div>
        <button type="submit">Update Chapter</button>
    </form>
{% endblock %}
