{% extends "layout.html" %}
{% block content %}
<div class="row mb-4">
    <div class="col-12 d-flex justify-content-between align-items-center">
        <h2>Time Slots for: {{ day[1] }}</h2>
        <div>
            <a href="{{ url_for('edit.index') }}" class="btn btn-secondary me-2"><i class="bi bi-arrow-left"></i> Back to Edit Menu</a>
        </div>
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-body p-0">
        <div class="list-group list-group-flush">
            {% for time in times %}
                <a href="{{ url_for('edit.edit_time', time_id=time[0]) }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="mb-1">{{ time[1] }}</h5>
                    </div>
                    <i class="bi bi-pencil-square text-primary"></i> Edit Time
                </a>
            {% else %}
                <div class="list-group-item text-muted fst-italic text-center py-4">
                    No time slots found for this day.
                </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
