{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h2 class="mb-0 h4">Edit Time Slot</h2>
                <a href="{{ url_for('edit.list_times', day_id=time[3]) }}" class="btn btn-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back</a>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('edit.edit_time', time_id=time[0]) }}">
                    <div class="mb-3">
                        <label for="from_time" class="form-label">From Time</label>
                        <input type="time" id="from_time" name="from_time" class="form-control" value="{{ time_str }}" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
