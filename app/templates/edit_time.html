{% extends "layout.html" %}
{% block content %}
    <h2>Edit Timing</h2>
    <a href="{{ url_for('edit.list_times', day_id=time[3]) }}">Back</a>
    <form method="POST" action="">
        <div>
            <label for="from_time">From Time</label>
            <input type="time" id="from_time" name="from_time" value="{{ time_str }}" required>
        </div>
        <button type="submit">Update Time</button>
    </form>
{% endblock %}
