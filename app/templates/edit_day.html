{% extends "layout.html" %}
{% block content %}
    <h2>Edit Day</h2>
    <a href="{{ url_for('edit.index') }}">Back</a>
    <form method="POST" action="">
        <div>
            <label for="name">Day Name</label>
            <input type="text" id="name" name="name" value="{{ day[1] }}" required>
        </div>
        <button type="submit">Update Day</button>
    </form>
{% endblock %}
