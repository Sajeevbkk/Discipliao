{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h2 class="mb-0 h4">Add Topic</h2>
                <a href="{{ url_for('add.index') }}" class="btn btn-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back</a>
            </div>
            <div class="card-body">
                <form id="subjectForm" method="GET" action="{{ url_for('add.add_topic') }}" class="mb-4">
                    <div class="mb-3">
                        <label for="subject_id" class="form-label">Subject</label>
                        <select id="subject_id" name="subject_id" class="form-select" onchange="this.form.submit()" required>
                            <option value="">Select Subject</option>
                            {% for subject in subjects %}
                                <option value="{{ subject[0] }}" {% if selected_subject_id|string == subject[0]|string %}selected{% endif %}>{{ subject[1] }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    {% if selected_chapter_id %}
                    <input type="hidden" name="chapter_id" value="{{ selected_chapter_id }}">
                    {% endif %}
                </form>

                {% if selected_subject_id %}
                <hr>
                <form method="POST" action="{{ url_for('add.add_topic') }}">
                    <input type="hidden" name="action" value="add">
                    <input type="hidden" name="subject_id" value="{{ selected_subject_id }}">

                    <div class="mb-3">
                        <label for="chapter_id" class="form-label">Chapter</label>
                        <select id="chapter_id" name="chapter_id" class="form-select" required>
                            <option value="">Select Chapter</option>
                            {% for chapter in chapters %}
                                <option value="{{ chapter[0] }}" {% if selected_chapter_id|string == chapter[0]|string %}selected{% endif %}>{{ chapter[1] }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="name" class="form-label">Topic Name</label>
                        <input type="text" id="name" name="name" class="form-control" required autofocus>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <div class="form-check">
                                <input type="checkbox" id="currently_studying" name="currently_studying" class="form-check-input">
                                <label for="currently_studying" class="form-check-label">Currently Studying?</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check">
                                <input type="checkbox" id="completed" name="completed" class="form-check-input">
                                <label for="completed" class="form-check-label">Completed?</label>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="priority" class="form-label">Priority (1-10)</label>
                        <input type="number" id="priority" name="priority" class="form-control" min="1" max="10" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Add Topic</button>
                    </div>
                </form>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
