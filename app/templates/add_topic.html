{% extends "layout.html" %}
{% block content %}
    <h2>Add Topic</h2>
    <a href="{{ url_for('add.index') }}">Back</a>
    <form id="subjectForm" method="GET" action="{{ url_for('add.add_topic') }}">
        <div>
            <label for="subject_id">Subject</label>
            <select id="subject_id" name="subject_id" onchange="this.form.submit()" required>
                <option value="">Select Subject</option>
                {% for subject in subjects %}
                    <option value="{{ subject[0] }}" {% if selected_subject_id|string == subject[0]|string %}selected{% endif %}>{{ subject[1] }}</option>
                {% endfor %}
            </select>
        </div>
    </form>

    {% if selected_subject_id %}
    <form method="POST" action="{{ url_for('add.add_topic') }}">
        <input type="hidden" name="action" value="add">
        <input type="hidden" name="subject_id" value="{{ selected_subject_id }}">
        <div>
            <label for="chapter_id">Chapter</label>
            <select id="chapter_id" name="chapter_id" required>
                <option value="">Select Chapter</option>
                {% for chapter in chapters %}
                    <option value="{{ chapter[0] }}">{{ chapter[1] }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label for="name">Topic Name</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div>
            <label for="currently_studying">Currently Studying?</label>
            <input type="checkbox" id="currently_studying" name="currently_studying">
        </div>
        <div>
            <label for="completed">Completed?</label>
            <input type="checkbox" id="completed" name="completed">
        </div>
        <div>
            <label for="priority">Priority (1-10)</label>
            <input type="number" id="priority" name="priority" min="1" max="10" required>
        </div>
        <button type="submit">Add Topic</button>
    </form>
    {% endif %}
{% endblock %}
